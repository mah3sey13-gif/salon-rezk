<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>صالون رزق | احجز دورك يا صاحبي</title>
  <meta name="description" content="تطبيق حجز طابور صالون الحلاقة رزق - احجز ميعادك بالساعة من موبايلك بدون تعقيد." />
  <!-- Cairo Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Cairo', system-ui, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-[#09090b] text-[#fafafa] flex flex-col font-sans selection:bg-emerald-500/20 selection:text-emerald-300">
  <main class="flex-1 w-full max-w-md mx-auto px-4 py-6 md:py-10" id="app-root">
    <!-- Dynamic Content Rendered Here -->
  </main>

  <script>
    // --- State & Store Management (LocalStorage) ---
    const DB_KEY = "salon_rezk_permanent_store";
    const OLD_KEYS = ["salon_rezk_db_store_v3", "salon_rezk_db_store_v2", "salon_rezk_db_store", "salon_rezk_db_store_v1"];
    const AUTH_KEY = "salon_rezk_auth";

    const TIME_SLOTS = [
      { id: "15:00", label: "03:00 م", time_ar: "03:00 عصراً" },
      { id: "16:00", label: "04:00 م", time_ar: "04:00 عصراً" },
      { id: "17:00", label: "05:00 م", time_ar: "05:00 مساءً" },
      { id: "18:00", label: "06:00 م", time_ar: "06:00 مساءً" },
      { id: "19:00", label: "07:00 م", time_ar: "07:00 مساءً" },
      { id: "20:00", label: "08:00 م", time_ar: "08:00 مساءً" },
      { id: "21:00", label: "09:00 م", time_ar: "09:00 مساءً" },
      { id: "22:00", label: "10:00 م", time_ar: "10:00 مساءً" },
      { id: "23:00", label: "11:00 م", time_ar: "11:00 مساءً" },
      { id: "00:00", label: "12:00 ص", time_ar: "12:00 منتصف الليل" },
    ];

    const DAY_NAMES = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    const MONTH_NAMES = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

    function getNowCairo() {
      try {
        return new Date(new Date().toLocaleString("en-US", { timeZone: "Africa/Cairo" }));
      } catch {
        return new Date();
      }
    }

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatArabicDate(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
      return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
    }

    function getNext15Days() {
      const now = getNowCairo();
      const list = [];
      for (let i = 0; i < 15; i++) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 12, 0, 0);
        const iso = formatDate(d);
        list.push({
          date: iso,
          dayOfWeek: d.getDay(),
          dayNameAr: DAY_NAMES[d.getDay()],
          formattedDateAr: formatArabicDate(iso),
          isToday: i === 0,
        });
      }
      return list;
    }

    // Main schedule: Today and upcoming days only (النهاردة وبكرة والأيام القادمة)
    function getAdminDays(store) {
      return getNext15Days();
    }

    // Archive: Past days (الأيام اللي ورا) sorted newest past day (yesterday) first
    function getArchivePastDays(store) {
      const now = getNowCairo();
      const todayIso = formatDate(now);
      const set = new Set();

      // 1. All past dates that have bookings
      (store.bookings || []).forEach(b => {
        if (b.booking_date && b.booking_date < todayIso) {
          set.add(b.booking_date);
        }
      });

      // 2. Generate past 15 days backwards from yesterday
      for (let i = 1; i <= 15; i++) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i, 12, 0, 0);
        set.add(formatDate(d));
      }

      // Sort descending (yesterday first, then earlier days)
      const sorted = Array.from(set).sort((a, b) => b.localeCompare(a));

      const yesterdayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1, 12, 0, 0);
      const yesterdayIso = formatDate(yesterdayDate);

      return sorted.map(dateStr => {
        const parts = dateStr.split("-").map(Number);
        const d = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
        const dayBookings = (store.bookings || []).filter(b => b.booking_date === dateStr);
        return {
          date: dateStr,
          dayOfWeek: d.getDay(),
          dayNameAr: DAY_NAMES[d.getDay()] || "",
          formattedDateAr: formatArabicDate(dateStr),
          isYesterday: dateStr === yesterdayIso,
          totalBooked: dayBookings.length,
          bookings: dayBookings
        };
      });
    }

    function getStore() {
      let mergedBookings = [];
      let existingSettings = {};
      let existingAnnouncements = [];
      let pin = "1991";
      let phone = "01211292518";

      // 1. Read current permanent key
      const currentRaw = localStorage.getItem(DB_KEY);
      if (currentRaw) {
        try {
          const parsed = JSON.parse(currentRaw);
          if (Array.isArray(parsed.bookings)) mergedBookings.push(...parsed.bookings);
          if (parsed.daySettings) existingSettings = { ...existingSettings, ...parsed.daySettings };
          if (Array.isArray(parsed.announcements)) existingAnnouncements = parsed.announcements;
          if (parsed.pin) pin = parsed.pin;
          if (parsed.phone) phone = parsed.phone;
        } catch (e) {}
      }

      // 2. Check and recover bookings from all past keys so NOTHING is ever lost
      for (const oldKey of OLD_KEYS) {
        const oldRaw = localStorage.getItem(oldKey);
        if (oldRaw) {
          try {
            const parsed = JSON.parse(oldRaw);
            if (Array.isArray(parsed.bookings)) {
              for (const b of parsed.bookings) {
                const exists = mergedBookings.some(x =>
                  x.id === b.id ||
                  (x.booking_date === b.booking_date && x.time_slot === b.time_slot && x.customer_phone === b.customer_phone)
                );
                if (!exists) {
                  mergedBookings.push(b);
                }
              }
            }
            if (parsed.daySettings) existingSettings = { ...parsed.daySettings, ...existingSettings };
          } catch (e) {}
        }
      }

      // 3. Fallback only if database is completely empty
      if (mergedBookings.length === 0) {
        const todayIso = formatDate(getNowCairo());
        mergedBookings = [
          {
            id: "b1",
            booking_date: todayIso,
            time_slot: "16:00",
            time_slot_label: "04:00 م",
            customer_name: "أحمد علي",
            customer_phone: "01012345678",
            queue_position: 1,
            status: "active",
            created_at: new Date().toISOString()
          },
          {
            id: "b2",
            booking_date: todayIso,
            time_slot: "19:00",
            time_slot_label: "07:00 م",
            customer_name: "محمود حسن",
            customer_phone: "01123456789",
            queue_position: 2,
            status: "active",
            created_at: new Date().toISOString()
          }
        ];
      }

      const result = {
        pin,
        phone,
        bookings: mergedBookings,
        daySettings: existingSettings,
        announcements: existingAnnouncements,
      };

      localStorage.setItem(DB_KEY, JSON.stringify(result));
      return result;
    }

    function saveStore(data) {
      localStorage.setItem(DB_KEY, JSON.stringify(data));
      // Also write back to all legacy keys so whatever code reads it sees the updated bookings
      for (const k of OLD_KEYS) {
        try { localStorage.setItem(k, JSON.stringify(data)); } catch (e) {}
      }
    }

    function normalizePhone(p) {
      let cleaned = (p || "").replace(/[^\d+]/g, "").trim();
      if (cleaned.startsWith("+20")) cleaned = "0" + cleaned.slice(3);
      else if (cleaned.startsWith("20") && cleaned.length === 12) cleaned = "0" + cleaned.slice(2);
      return cleaned;
    }

    function isValidPhone(p) {
      const norm = normalizePhone(p);
      return /^01[0125][0-9]{8}$/.test(norm) || /^\d{11}$/.test(norm);
    }

    // --- Router ---
    let currentRoute = "/";
    let routeParams = {};

    function navigate(route, params = {}) {
      currentRoute = route;
      routeParams = params;
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      const root = document.getElementById("app-root");
      if (currentRoute === "/") {
        renderHome(root);
      } else if (currentRoute.startsWith("/book")) {
        renderBook(root, routeParams.date);
      } else if (currentRoute === "/track") {
        renderTrack(root);
      } else if (currentRoute === "/admin/login") {
        renderAdminLogin(root);
      } else if (currentRoute === "/admin/archive") {
        renderAdminArchive(root);
      } else if (currentRoute === "/admin") {
        renderAdmin(root);
      }
      lucide.createIcons();
    }

    // 1. HOME VIEW (Customer doesn't see total count!)
    function renderHome(root) {
      const store = getStore();
      const days = getNext15Days();
      const activeAnn = store.announcements.find(a => a.is_active);

      const daysHtml = days.map(d => {
        const setting = store.daySettings[d.date];
        const isClosed = setting?.is_closed ?? false;
        const activeBookings = store.bookings.filter(b => b.booking_date === d.date && (b.status === "active" || b.status === "rescheduled"));
        const count = activeBookings.length;
        const isFull = count >= 10;
        const canBook = !isClosed && !isFull;

        let badgeClass = "bg-emerald-950/50 text-emerald-400 border-emerald-800/50";
        let cardClass = "border-zinc-800/80 hover:border-zinc-700 bg-zinc-900/80";
        let label = "متاح";

        if (isClosed) {
          badgeClass = "bg-rose-950/40 text-rose-300 border-rose-800/50";
          cardClass = "border-rose-900/30 bg-zinc-950/60 opacity-85 cursor-not-allowed";
          label = "مغلق";
        } else if (isFull) {
          badgeClass = "bg-rose-950/50 text-rose-400 border-rose-800/50";
          cardClass = "border-zinc-800/50 bg-zinc-950/60 opacity-85 cursor-not-allowed";
          label = "مكتمل";
        }

        const inner = `
          <div class="w-full p-4 rounded-2xl border ${cardClass} transition flex items-center justify-between shadow-sm relative overflow-hidden">
            <div class="space-y-1.5 max-w-[70%]">
              <div class="flex items-center gap-2">
                <span class="font-bold text-base md:text-lg text-white">${d.dayNameAr}</span>
                ${d.isToday ? '<span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-semibold border border-emerald-500/20">النهاردة</span>' : ''}
              </div>
              <p class="text-xs text-zinc-400 font-medium">${d.formattedDateAr}</p>
              ${isClosed ? `<p class="text-xs text-rose-300 font-bold flex items-center gap-1 pt-0.5"><span>⚠️ مغلق</span>${setting?.close_reason ? `<span>— السبب: ${setting.close_reason}</span>` : ''}</p>` : ''}
            </div>
            <div class="text-left">
              <div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-semibold border ${badgeClass}">
                ${isClosed ? '<i data-lucide="circle-x" class="w-3.5 h-3.5 text-rose-400"></i>' : ''}
                <span>${label}</span>
              </div>
            </div>
          </div>
        `;

        if (canBook) {
          return `<div onclick="navigate('/book', { date: '${d.date}' })" class="block focus:outline-none focus:ring-2 focus:ring-emerald-500/40 rounded-2xl cursor-pointer">${inner}</div>`;
        } else {
          return `<div>${inner}</div>`;
        }
      }).join("");

      root.innerHTML = `
        <div class="space-y-6 pb-12">
          <!-- Header -->
          <header class="text-center pt-2 pb-4 space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-inner mb-2 text-emerald-400">
              <i data-lucide="scissors" class="w-7 h-7 transform -scale-x-100"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-white">صالون رزق</h1>
            <p class="text-zinc-400 text-sm md:text-base font-medium">احجز ميعادك يا صاحبي بالساعة</p>
          </header>

          <!-- Emergency Announcement -->
          ${activeAnn ? `
            <div class="p-4 rounded-2xl bg-rose-950/60 border border-rose-600/40 text-rose-200 flex items-center gap-3 shadow-lg animate-in fade-in">
              <i data-lucide="triangle-alert" class="w-5 h-5 text-rose-400 shrink-0"></i>
              <div class="text-sm font-medium leading-relaxed flex flex-wrap items-center gap-1.5">
                <span class="font-bold text-rose-300">تنبيه طارئ من رزق:</span>
                <span class="text-rose-100 font-semibold">${activeAnn.message}</span>
              </div>
            </div>
          ` : ''}

          <!-- Track Button -->
          <button onclick="navigate('/track')" class="w-full flex items-center justify-between p-3.5 px-4 rounded-xl bg-zinc-900/90 border border-zinc-800 text-zinc-200 hover:border-zinc-700 hover:bg-zinc-800/80 transition shadow-sm group cursor-pointer">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-400 group-hover:text-emerald-400 group-hover:bg-zinc-700 transition">
                <i data-lucide="search" class="w-4 h-4"></i>
              </div>
              <span class="font-semibold text-sm">متابعة حجزي</span>
            </div>
            <i data-lucide="chevron-left" class="w-4 h-4 text-zinc-500 group-hover:text-zinc-300 transition"></i>
          </button>

          <!-- Day Title -->
          <div class="flex items-center justify-between pt-2">
            <h2 class="text-lg font-bold text-zinc-100 flex items-center gap-2">
              <i data-lucide="calendar" class="w-5 h-5 text-emerald-400"></i>
              <span>اختر اليوم المناسب</span>
            </h2>
          </div>

          <!-- Days List -->
          <div class="space-y-3">
            ${daysHtml}
          </div>

          <!-- Footer -->
          <footer class="pt-6 border-t border-zinc-900 text-center space-y-4">
            <div class="p-4 rounded-2xl bg-zinc-900/60 border border-zinc-800 space-y-2.5 text-center text-sm shadow-sm">
              <p class="font-bold text-emerald-300 flex items-center justify-center gap-2">
                <i data-lucide="phone-call" class="w-4 h-4 text-emerald-400"></i>
                <span>رزق هيتصل بيك لما ييجي ميعادك</span>
              </p>
              <p class="text-xs text-zinc-400">لو عاوز تلغي الحجز رن على رزق</p>
              <div class="pt-1 flex items-center justify-center gap-2.5 flex-wrap">
                <a href="tel:01211292518" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 text-emerald-400 border border-zinc-800 hover:border-emerald-500/50 font-mono text-sm font-bold transition shadow-xs cursor-pointer" dir="ltr">
                  <i data-lucide="phone" class="w-4 h-4 text-emerald-400"></i>
                  <span>01211292518</span>
                </a>
                <a href="https://wa.me/201211292518" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-950/70 hover:bg-emerald-900/90 text-emerald-300 border border-emerald-600/50 hover:border-emerald-500 text-sm font-bold transition shadow-xs cursor-pointer group">
                  <svg class="w-4 h-4 fill-emerald-400 group-hover:scale-110 transition shrink-0" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                  </svg>
                  <span>واتساب رزق</span>
                </a>
              </div>
            </div>
            <div class="pt-2">
              <button onclick="navigate('/admin')" class="text-[11px] text-zinc-600 hover:text-zinc-400 transition underline underline-offset-4 cursor-pointer">
                إدارة الصالون
              </button>
            </div>
          </footer>
        </div>
      `;
    }

    // 2. BOOK VIEW (Hourly slot selector)
    let selectedBookingSlot = "15:00";

    function renderBook(root, dateStr) {
      const store = getStore();
      const formattedDate = formatArabicDate(dateStr);
      const activeBookings = store.bookings.filter(b => b.booking_date === dateStr && (b.status === "active" || b.status === "rescheduled"));

      // Find first available slot
      const firstFree = TIME_SLOTS.find(s => !activeBookings.some(b => b.time_slot === s.id));
      if (firstFree && !selectedBookingSlot) {
        selectedBookingSlot = firstFree.id;
      }

      const slotsGrid = TIME_SLOTS.map(s => {
        const isBooked = activeBookings.some(b => b.time_slot === s.id);
        const isSelected = selectedBookingSlot === s.id;

        return `
          <button type="button" ${isBooked ? 'disabled' : ''} onclick="selectedBookingSlot='${s.id}'; render();" class="h-12 px-3 rounded-xl border font-bold text-sm flex items-center justify-between transition cursor-pointer ${
            isSelected
              ? 'bg-emerald-600 border-emerald-500 text-white shadow-md shadow-emerald-950/50 scale-[1.02]'
              : !isBooked
              ? 'bg-zinc-900 border-zinc-800 text-zinc-200 hover:border-zinc-700 hover:bg-zinc-800'
              : 'bg-zinc-950 border-zinc-900 text-zinc-600 opacity-50 cursor-not-allowed'
          }">
            <span>${s.label}</span>
            <span class="text-[11px] font-medium">${isSelected ? 'محدد ✓' : !isBooked ? 'متاح' : 'محجوز'}</span>
          </button>
        `;
      }).join("");

      root.innerHTML = `
        <div class="space-y-6 pt-2 pb-12">
          <div class="flex items-center justify-between">
            <button onclick="navigate('/')" class="inline-flex items-center gap-1.5 text-sm font-medium text-zinc-400 hover:text-white transition p-1 cursor-pointer">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
              <span>رجوع للأيام</span>
            </button>
          </div>

          <div class="p-4 rounded-2xl bg-zinc-900/90 border border-zinc-800 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-950/60 border border-emerald-800/40 flex items-center justify-center text-emerald-400 shrink-0">
              <i data-lucide="calendar" class="w-5 h-5"></i>
            </div>
            <div>
              <span class="text-xs text-zinc-400 font-medium">اليوم المختار للحجز:</span>
              <h2 class="text-lg font-bold text-white">${formattedDate}</h2>
            </div>
          </div>

          <div class="space-y-1">
            <h1 class="text-2xl font-extrabold text-white">اختر ساعتك واحجز دورك</h1>
            <p class="text-xs text-zinc-400">اختار الساعة المناسبة ليك من 3 عصراً لحد 12 منتصف الليل.</p>
          </div>

          <div id="book-error" class="hidden p-3.5 rounded-xl bg-rose-950/50 border border-rose-800/60 text-rose-300 text-sm flex items-start gap-2.5">
            <i data-lucide="circle-alert" class="w-5 h-5 text-rose-400 shrink-0 mt-0.5"></i>
            <p id="book-error-text" class="font-medium leading-normal"></p>
          </div>

          <form id="book-form" class="space-y-5">
            <!-- Hourly Slots Grid -->
            <div class="space-y-2">
              <label class="block text-sm font-bold text-zinc-200 flex items-center gap-2">
                <i data-lucide="clock" class="w-4 h-4 text-emerald-400"></i>
                <span>الساعة المناسبة للحجز</span>
              </label>
              <div class="grid grid-cols-2 gap-2">
                ${slotsGrid}
              </div>
            </div>

            <div class="space-y-2">
              <label class="block text-sm font-bold text-zinc-200">الاسم</label>
              <div class="relative">

              <span>الرجوع لجدول اليوم</span>
            </button>

            <div class="flex items-center gap-2">
              <button onclick="navigate('/')" class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white border border-zinc-800 transition cursor-pointer" title="زيارة الموقع">
                <i data-lucide="home" class="w-5 h-5"></i>
              </button>
              <button onclick="sessionStorage.removeItem('${AUTH_KEY}'); navigate('/admin/login');" class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-rose-400 border border-zinc-800 transition cursor-pointer" title="تسجيل الخروج">
                <i data-lucide="log-out" class="w-5 h-5"></i>
              </button>
            </div>
          </header>

          <!-- Archive Banner -->
          <div class="p-5 rounded-3xl bg-gradient-to-br from-zinc-900 to-zinc-950 border border-zinc-800 flex items-center justify-between shadow-lg relative overflow-hidden">
            <div class="space-y-1 relative z-10">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center">
                  <i data-lucide="archive" class="w-4 h-4"></i>
                </div>
                <h1 class="text-xl md:text-2xl font-black text-white">أرشيف الأيام السابقة</h1>
              </div>
              <p class="text-xs text-zinc-400">اختر أي يوم سابق من القائمة بالأعلى لعرض مواعيده وحجوزاته</p>
            </div>
            <div class="text-left relative z-10">
              <span class="text-2xl md:text-3xl font-black text-emerald-400 font-mono">${allPastBookings.length}</span>
              <p class="text-[10px] text-zinc-400 font-semibold">حجوزات سابقة</p>
            </div>
          </div>

          <!-- Past Days Horizontal Scroll Bar (الأيام اللي ورا) -->
          <div class="space-y-2">
            <div class="flex items-center justify-between text-xs text-zinc-400 font-semibold px-1">
              <span class="flex items-center gap-1.5 text-zinc-300">
                <i data-lucide="calendar-clock" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span>قائمة الأيام السابقة (اضغط على اليوم):</span>
              </span>
              <span class="text-xs text-zinc-400 font-mono">${pastDays.length} يوم</span>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 pt-1 no-scrollbar scroll-smooth">
              ${pastDaysTabsHtml}

              <!-- All Past Days Tab -->
              <button onclick="selectedArchiveDate='all'; render();" class="flex-shrink-0 px-4 py-3 rounded-2xl border text-right transition cursor-pointer min-w-[115px] ${selectedArchiveDate === 'all' ? 'bg-emerald-950/70 border-emerald-500 text-white shadow-md shadow-emerald-950/50 ring-1 ring-emerald-500/40' : 'bg-zinc-900/80 border-zinc-800 text-zinc-400 hover:border-zinc-700 hover:text-zinc-200'}">
                <div class="flex items-center justify-between mb-1">
                  <span class="font-bold text-sm text-white">كل الأيام</span>
                  <i data-lucide="layers" class="w-3.5 h-3.5 text-emerald-400"></i>
                </div>
                <div class="text-[11px] text-zinc-400 mb-1.5">أرشيف مجمع</div>
                <div class="text-[11px] font-bold text-emerald-400">${allPastBookings.length} حجز</div>
              </button>
            </div>
          </div>

          <!-- Selected Day Overview Card -->
          <div class="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-3">
            <div class="flex items-center justify-between">
              <div class="space-y-0.5">
                <h2 class="text-lg font-extrabold text-white flex items-center gap-2">
                  <span>${selectedArchiveDate === 'all' ? 'عرض كل الأيام السابقة مجمعة' : selectedDayObj?.formattedDateAr || selectedArchiveDate}</span>
                  ${selectedDayObj?.isYesterday ? '<span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-950/80 text-amber-300 border border-amber-800">أمس</span>' : ''}
                </h2>
                <p class="text-xs text-zinc-400">
                  ${selectedArchiveDate === 'all' ? `إجمالي الحجوزات السابقة: ${allPastBookings.length} حجز` : `الحجوزات المسجلة في هذا اليوم: ${currentBookings.length} حجز`}
                </p>
              </div>

              <div class="flex items-center gap-1.5">
                <span class="text-xs px-3 py-1.5 rounded-xl bg-zinc-950 border border-zinc-800 text-emerald-400 font-mono font-bold">
                  ${currentBookings.length} حجز
                </span>
              </div>
            </div>

            <!-- Search Bar inside Selected Day -->
            <div class="relative pt-1 border-t border-zinc-800/80">
              <input id="archive-search-input" type="text" value="${archiveSearch}" placeholder="ابحث باسم الزبون أو رقم التليفون أو الساعة..." class="w-full h-11 pr-10 pl-16 rounded-xl bg-zinc-950 border border-zinc-800 text-white placeholder-zinc-500 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition" />
              <div class="absolute right-3 top-[17px] text-zinc-400 pointer-events-none">
                <i data-lucide="search" class="w-4 h-4"></i>
              </div>
              ${archiveSearch ? `
                <button onclick="archiveSearch=''; render();" class="absolute left-2.5 top-[14px] text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-0.5 rounded-lg">
                  مسح
                </button>
              ` : ''}
            </div>

            <!-- Quick Filter Badges -->
            <div class="flex gap-2 text-xs font-semibold overflow-x-auto pb-0.5 no-scrollbar">
              <button onclick="archiveFilter='all'; render();" class="px-3 py-1 rounded-lg border transition cursor-pointer ${archiveFilter === 'all' ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-zinc-950 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
                الكل (${currentBookings.length})
              </button>
              <button onclick="archiveFilter='completed'; render();" class="px-3 py-1 rounded-lg border transition cursor-pointer ${archiveFilter === 'completed' ? 'bg-blue-950 text-blue-300 border-blue-600 font-bold' : 'bg-zinc-950 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
                تم الحلاقة (${currentBookings.filter(b => b.status === 'completed').length})
              </button>
              <button onclick="archiveFilter='active'; render();" class="px-3 py-1 rounded-lg border transition cursor-pointer ${archiveFilter === 'active' ? 'bg-emerald-950 text-emerald-300 border-emerald-600 font-bold' : 'bg-zinc-950 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
                نشط (${currentBookings.filter(b => b.status === 'active' || b.status === 'rescheduled').length})
              </button>
              <button onclick="archiveFilter='cancelled'; render();" class="px-3 py-1 rounded-lg border transition cursor-pointer ${archiveFilter === 'cancelled' ? 'bg-rose-950 text-rose-300 border-rose-600 font-bold' : 'bg-zinc-950 border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
                ملغي (${currentBookings.filter(b => b.status === 'cancelled').length})
              </button>
            </div>
          </div>

          <!-- Bookings List for Selected Past Day -->
          <div class="space-y-3">
            <div class="flex items-center justify-between px-1 text-xs text-zinc-400">
              <span class="font-semibold text-zinc-300 flex items-center gap-1.5">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span>حجوزات ${selectedArchiveDate === 'all' ? 'الأرشيف' : selectedDayObj?.dayNameAr || ''} (${filtered.length})</span>
              </span>
              ${archiveFilter !== 'all' || archiveSearch ? `<button onclick="archiveFilter='all'; archiveSearch=''; render();" class="text-emerald-400 hover:underline">إلغاء الفلاتر</button>` : ''}
            </div>

            ${filtered.length === 0 ? `
              <div class="p-8 rounded-3xl bg-zinc-900/60 border border-zinc-800 text-center space-y-2">
                <i data-lucide="calendar-x" class="w-10 h-10 text-zinc-600 mx-auto"></i>
                <p class="text-sm font-bold text-zinc-300">مفيش أي حجوزات ${archiveSearch ? 'مطابقة للبحث' : 'مسجلة في هذا اليوم'}</p>
                <p class="text-xs text-zinc-500">${archiveSearch ? 'جرب تبحث باسم أو رقم تاني' : 'تقدر تختار يوم سابق تاني من القائمة اللي فوق'}</p>
              </div>
            ` : `
              <div class="space-y-3">
                ${filtered.map(b => {
                  const isCompleted = b.status === "completed";
                  const isCancelled = b.status === "cancelled";
                  const isActive = !isCompleted && !isCancelled;

                  let badgeColor = "bg-emerald-950 text-emerald-300 border-emerald-800";
                  let badgeText = "نشط";
                  if (isCompleted) {
                    badgeColor = "bg-blue-950 text-blue-300 border-blue-800";
                    badgeText = "تم الحلاقة ✓";
                  } else if (isCancelled) {
                    badgeColor = "bg-rose-950 text-rose-300 border-rose-800";
                    badgeText = "ملغي ✕";
                  }

                  return `
                    <div class="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 hover:border-zinc-700 transition shadow-sm space-y-3">
                      <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1">
                          <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-bold text-base text-white ${isCompleted ? 'line-through opacity-85' : ''}">${b.customer_name}</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-xl font-bold font-mono bg-zinc-950 border border-zinc-800 text-emerald-400">${b.time_slot_label || 'الساعة محددة'}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full border ${badgeColor} font-semibold">${badgeText}</span>
                          </div>
                          <div class="flex items-center gap-3 text-xs text-zinc-400 flex-wrap">
                            <span class="flex items-center gap-1 text-zinc-300 font-medium">
                              <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-500"></i>
                              <span>${formatArabicDate(b.booking_date)}</span>
                            </span>
                            <a href="tel:${b.customer_phone}" class="flex items-center gap-1 font-mono text-zinc-400 hover:text-emerald-400 transition" dir="ltr">
                              <i data-lucide="phone" class="w-3 h-3 text-emerald-400"></i>
                              <span>${b.customer_phone}</span>
                            </a>
                          </div>
                          ${b.admin_notes ? `<div class="text-[11px] text-zinc-400 bg-zinc-950/70 p-2 rounded-lg border border-zinc-800/50 mt-1">📝 ${b.admin_notes}</div>` : ''}
                        </div>

                        <a href="tel:${b.customer_phone}" class="p-2.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 transition shrink-0" title="اتصال بالزبون">
                          <i data-lucide="phone-call" class="w-4 h-4"></i>
                        </a>
                      </div>

                      <!-- Archive Item Quick Actions -->
                      <div class="flex items-center justify-between pt-2 border-t border-zinc-800/70 text-xs gap-1.5 flex-wrap">
                        <div class="flex items-center gap-1.5">
                          ${isActive ? `
                            <button onclick="setBookingStatus('${b.id}', 'completed')" class="px-2.5 py-1 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 font-semibold cursor-pointer transition">
                              تم الحلاقة ✓
                            </button>
                          ` : `
                            <button onclick="setBookingStatus('${b.id}', 'active')" class="px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 cursor-pointer transition">
                              إرجاع كـ نشط
                            </button>
                          `}
                          <button onclick="editBookingPrompt('${b.id}')" class="px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 cursor-pointer transition">
                            تعديل
                          </button>
                        </div>
                        <button onclick="deleteBookingPermanent('${b.id}', '${b.customer_name}')" class="px-2 py-1 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 border border-rose-800/40 cursor-pointer transition" title="حذف نهائي من الأرشيف">
                          حذف نهائي
                        </button>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </div>
        </div>
      `;

      // Attach search input listener
      const sInput = document.getElementById("archive-search-input");
      if (sInput) {
        sInput.oninput = function(e) {
          archiveSearch = e.target.value;
          render();
          const nextInput = document.getElementById("archive-search-input");
          if (nextInput) {
            nextInput.focus();
            nextInput.selectionStart = nextInput.selectionEnd = nextInput.value.length;
          }
        };
      }
    }

    function deleteBookingPermanent(id, name) {
      if (confirm(`هل أنت متأكد من مسح حجز "${name}" نهائياً من الأرشيف؟`)) {
        const store = getStore();
        store.bookings = store.bookings.filter(b => b.id !== id);
        saveStore(store);
        render();
      }
    }

    // --- Admin Actions ---
    function setBookingStatus(id, st) {
      const store = getStore();
      const b = store.bookings.find(x => x.id === id);
      if (b) {
        b.status = st;
        saveStore(store);
        render();
      }
    }

    function editBookingPrompt(id) {
      const store = getStore();
      const b = store.bookings.find(x => x.id === id);
      if (!b) return;
      const newName = prompt("تعديل اسم الزبون:", b.customer_name);
      if (newName === null) return;
      const newPhone = prompt("تعديل رقم التليفون:", b.customer_phone);
      if (newPhone === null) return;
      const newNotes = prompt("ملاحظات الحلاق:", b.admin_notes || "");

      b.customer_name = newName.trim() || b.customer_name;
      b.customer_phone = normalizePhone(newPhone) || b.customer_phone;
      b.admin_notes = newNotes || undefined;

      saveStore(store);
      render();
    }

    function cancelBookingPrompt(id, name) {
      if (confirm(`هل أنت متأكد من إلغاء حجز ${name}؟`)) {
        setBookingStatus(id, "cancelled");
      }
    }

    function setDayStatus(isClosed) {
      const store = getStore();
      let reason = undefined;
      if (isClosed) {
        reason = prompt("سبب الإغلاق (اختياري، مثلاً: صيانة / إجازة):", "ظرف طارئ");
        if (reason === null) return;
      }
      store.daySettings[selectedAdminDate] = {
        date: selectedAdminDate,
        is_closed: isClosed,
        close_reason: reason
      };
      saveStore(store);
      render();
    }

    function resetCurrentDay() {
      const store = getStore();
      if (confirm(`هل أنت متأكد من مسح وتصفير كل مواعيد هذا اليوم (${formatArabicDate(selectedAdminDate)})؟`)) {
        store.bookings = store.bookings.filter(b => b.booking_date !== selectedAdminDate);
        saveStore(store);
        render();
      }
    }

    function openPasswordModal() {
      const modal = document.getElementById("password-modal");
      if (!modal) return;
      modal.classList.remove("hidden");
      const msg = document.getElementById("password-modal-msg");
      if (msg) msg.classList.add("hidden");
      const form = document.getElementById("password-modal-form");
      if (form) form.reset();
      const curr = document.getElementById("modal-curr-pin");
      if (curr) curr.focus();
      lucide.createIcons();
    }

    function closePasswordModal() {
      const modal = document.getElementById("password-modal");
      if (modal) modal.classList.add("hidden");
    }

    function handlePasswordModalSubmit(e) {
      e.preventDefault();
      const store = getStore();
      const curr = document.getElementById("modal-curr-pin").value.trim();
      const newP = document.getElementById("modal-new-pin").value.trim();
      const confP = document.getElementById("modal-confirm-pin").value.trim();
      const msg = document.getElementById("password-modal-msg");

      if (curr !== store.pin) {
        msg.className = "p-3 rounded-xl text-xs font-semibold bg-rose-950/70 border border-rose-800/60 text-rose-300 block";
        msg.textContent = "كلمة السر الحالية غير صحيحة! ❌";
        return;
      }

      if (!newP) {
        msg.className = "p-3 rounded-xl text-xs font-semibold bg-rose-950/70 border border-rose-800/60 text-rose-300 block";
        msg.textContent = "كلمة السر الجديدة لا يمكن أن تكون فارغة!";
        return;
      }

      if (newP !== confP) {
        msg.className = "p-3 rounded-xl text-xs font-semibold bg-rose-950/70 border border-rose-800/60 text-rose-300 block";
        msg.textContent = "كلمتا السر غير متطابقتين! ❌";
        return;
      }

      store.pin = newP;
      saveStore(store);

      msg.className = "p-3 rounded-xl text-xs font-semibold bg-emerald-950/70 border border-emerald-800/60 text-emerald-300 block";
      msg.textContent = "تم تغيير كلمة السر بنجاح! كلمة السر الجديدة هي: " + newP + " ✅";

      setTimeout(() => {
        closePasswordModal();
      }, 1500);
    }

    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>
